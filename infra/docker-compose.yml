services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - db
    networks:
      # internal: DB connectivity. external: outbound calls to UDL
      # and the Anthropic API (the assistant reasoning pipeline).
      - internal
      - external
    volumes:
      - ../backend:/app
      # /workspace gives alembic access to alembic.ini and migrations/
      # at the repo root (the dev.ps1 script runs migrations via
      # `docker compose exec -w /workspace backend alembic upgrade head`).
      - ..:/workspace
      # Persistent storage for operator-uploaded procedures. The path
      # matches PROCEDURE_STORAGE_PATH in config defaults.
      - procedures_data:/data/procedures

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
      - external

volumes:
  postgres_data:
  procedures_data:

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
