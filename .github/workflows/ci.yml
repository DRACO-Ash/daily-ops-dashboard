name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: pip install ruff mypy bandit
      - run: ruff check backend/app
      - run: mypy backend/app
      - run: bandit -r backend/app -ll
      - run: pip install pytest pytest-asyncio pytest-cov httpx
      - run: pytest tests/backend --cov=app --cov-report=term --cov-fail-under=40
        env:
          PYTHONPATH: backend
          APP_SECRET_KEY: test-secret-key-for-ci-only
          APP_ENV: development
          APP_ALLOWED_ORIGINS: '["http://localhost:3000"]'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ops_dashboard
          POSTGRES_USER: ops_user
          POSTGRES_PASSWORD: test-password
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run format:check
      - run: cd frontend && npm run test
      - run: cd frontend && npm run build

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}