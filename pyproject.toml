[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/backend"]
pythonpath = ["backend"]

[tool.coverage.run]
# Measures the Python backend only. The React frontend (frontend/src) is
# NOT in this figure; see deploy/APPSTORE.md.
source = ["app"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
fail_under = 90

[tool.coverage.xml]
output = "coverage.xml"